name: Docker (build + push)

# Builds every bootgly/bootgly_benchmarks:<opponent> image on the fresh
# bootgly/bootgly base and pushes them to Docker Hub — one matrix job per
# opponent (opt in via its WITH_<X> build ARG).
#
# The Bootgly kit image stays dependency-free and is
# built by the bootgly repo's own docker.yml on release. This workflow runs
# AFTER that: it consumes the published bootgly/bootgly as its base, so it
# must never run before the framework image for a given release is on Hub.
#
# Triggers:
#   - repository_dispatch (framework-release): fired by bootgly/docker.yml right
#     after it pushes bootgly/bootgly, so the base is guaranteed fresh.
#   - workflow_dispatch: manual re-run (optionally against a specific base tag).
#
# Required repository secrets: DOCKER_USERNAME, DOCKER_PASSWORD (the bootgly
# Docker Hub account).

on:
  repository_dispatch:
    types: [framework-release]
  workflow_dispatch:
    inputs:
      base:
        description: 'Base framework image to build FROM, e.g. bootgly/bootgly:1.0.0 (required — there is no safe default).'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Bootgly itself — the harness with no opponent baked in. It is also
          # the base every comparison starts from, so it must be built like the
          # others and never by hand.
          - { tag: bootgly,        arg: WITH_NOTHING }
          # PHP opponents
          - { tag: swoole,         arg: WITH_SWOOLE }
          - { tag: workerman,      arg: WITH_WORKERMAN }
          - { tag: roadrunner,     arg: WITH_ROADRUNNER }
          - { tag: frankenphp,     arg: WITH_FRANKENPHP }
          - { tag: hyperf,         arg: WITH_HYPERF }
          - { tag: reactphp,       arg: WITH_REACTPHP }
          - { tag: amphp,          arg: WITH_AMPHP }
          - { tag: laravel-octane, arg: WITH_LARAVEL_OCTANE }
          # JS opponents — every WITH_* the Dockerfile accepts must be listed
          # here, or its image is only ever produced by a manual local build and
          # silently ages behind the others on every framework release.
          - { tag: express,        arg: WITH_EXPRESS }
          - { tag: bun,            arg: WITH_BUN }

    steps:
      - name: Checkout bootgly_benchmarks
        uses: actions/checkout@v5

      # ! No default. The framework repo publishes no moving stable alias, so the
      #   only candidates would be `rc`/`beta` — which freeze on the last
      #   pre-release once a stable ships, and would then bake every contender on
      #   pre-release code while the run stays green. A release dispatch always
      #   carries the exact version; a manual run has to name one.
      # ! Untrusted values reach the shell through `env:`, never through `${{ }}`
      #   inside `run:` — GitHub substitutes those TEXTUALLY before bash parses
      #   the script. `client_payload` comes from a repository_dispatch, whose
      #   token is scoped to this repository alone; this job holds the Docker Hub
      #   credentials for the whole `bootgly/*` namespace.
      - name: Resolve base image
        id: base
        env:
          PAYLOAD_BASE: ${{ github.event.client_payload.base }}
          INPUT_BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          B="${PAYLOAD_BASE:-${INPUT_BASE:-}}"
          if [ -z "$B" ]; then
            echo "::error::Name the base framework image (e.g. -f base=bootgly/bootgly:1.0.0). There is no default: bootgly/bootgly has no moving stable alias, and defaulting to a pre-release channel would silently benchmark unreleased code."
            exit 1
          fi
          echo "value=$B" >> "$GITHUB_OUTPUT"
          echo "Base image: $B"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.tag }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BOOTGLY_FRAMEWORK_IMAGE=${{ steps.base.outputs.value }}
            ${{ matrix.arg }}=1
          tags: |
            bootgly/bootgly_benchmarks:${{ matrix.tag }}
